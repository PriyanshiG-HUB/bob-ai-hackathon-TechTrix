submission:
  title: "PharmaSentinel AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Pharmaceutical safety teams and regulatory submission teams face large
    volumes of complex data that are difficult and time-consuming to review
    manually. Adverse-event databases can hide emerging drug safety signals,
    while incomplete CTD dossiers can lead to regulatory delays, costly
    rework, and missed submission requirements.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    PharmaSentinel AI is a dual-mode pharmaceutical intelligence solution
    that detects potential drug safety signals from adverse-event reports
    using clustering and Proportional Reporting Ratio (PRR) analysis, while
    also checking regulatory submission readiness against ICH M4 CTD
    requirements. It provides safety-signal insights, module-wise
    completeness scores, and an actionable gap report to support faster
    review and submission preparation.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Adverse-event report clustering to identify groups and emerging safety patterns"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "PRR-based statistical signal detection to flag potential drug-event associations"
    - "ICH M4 CTD-based dossier completeness checking across the five CTD modules"
    - "Module-wise submission readiness scoring with missing-section identification"                               # optional 4th
    - "Actionable gap reports highlighting regulatory documentation areas requiring attention"                               # optional 5th

  tech_stack:
    languages: ["Python 3.11+", "TypeScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React 19"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai", "IBM Bob", "IBM Cloud Functions","Model Context Protocol (MCP)"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Pandas", "NumPy", "SciPy", "Pytest", "Vite", "React Router DOM", "Axios", "Phosphor Icons", "Docker", "GitHub Actions"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of combining two high-impact pharmaceutical workflows
    into a single solution: statistical drug-safety signal detection and
    regulatory submission readiness. Instead of requiring teams to manually
    inspect large volumes of safety data and lengthy regulatory checklists,
    PharmaSentinel AI converts complex information into interpretable signals,
    readiness scores, and actionable gaps.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The solution is intended as a decision-support and screening tool rather
    than a replacement for qualified pharmacovigilance or regulatory experts.
    Signal detection results require appropriate clinical and statistical
    review, and the submission checker depends on the completeness and
    structure of the provided dossier outline. Additional validation on
    larger real-world datasets and integration with production regulatory
    systems would be required for deployment in a regulated environment.

